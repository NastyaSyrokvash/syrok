<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Handouts</title>
    
    <style>
        /* --- СИНИЙ ДИЗАЙН --- */
        body {
            background-color: #e6f0fa; /* Нежно-голубой фон */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0; /* Отступы сверху и снизу */
            box-sizing: border-box;
        }

        /* Декоративные круги на фоне */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.4;
            z-index: -1;
        }
        .bg-c1 { width: 250px; height: 250px; top: 10%; left: 5%; }
        .bg-c2 { width: 300px; height: 300px; bottom: -5%; right: 5%; }

        h1 {
            color: #1a365d;
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
        }

        /* Контейнер для PDF */
        .pdf-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.4);
            padding: 10px;
            width: 90vw;        /* 90% от ширины экрана */
            max-width: 1200px;  /* Но не больше 1200 пикселей */
            height: 75vh;       /* 75% от высоты экрана */
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Сам PDF */
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: inline-block;
            background-color: #1a365d; /* Темно-синий, как кнопка Handouts */
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.3);
        }
        .download-btn:hover { 
            background-color: #2b4c7e; 
            transform: translateY(-2px);
        }

        /* Навигация (кнопки с цифрами) */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .number-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #cce0ff;
            color: #1a365d;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: background-color 0.3s;
        }
        .number-btn:hover { background-color: #a3c4ff; }

        /* Кнопки Home и Handouts */
        .action-buttons { display: flex; gap: 20px; }
        .main-btn {
            display: block;
            padding: 15px 50px;
            background-color: #1a365d;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: background-color 0.3s;
        }
        .btn-home { background-color: #7a9cc6; }
        .main-btn:hover { background-color: #2b4c7e; }
    </style>
</head>
<body>

    <!-- Фоновые круги -->
    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>

    <h1>My handouts</h1>
    
    <!-- Контейнер для PDF -->
    <div class="pdf-container">
        <!-- ВАЖНО: Проверьте, что файл называется именно Handouts.pdf и лежит в той же папке -->
        <iframe src="Handouts.pdf" type="application/pdf"></iframe>
    </div>

    <!-- Кнопка скачивания (добавлен атрибут download) -->
    <a href="Handouts.pdf" download class="download-btn">📥 Download handouts (PDF)</a>

    <!-- Навигация -->
    <div class="buttons-container">
        <a href="index.html" class="number-btn">0</a>
        <a href="task1.html" class="number-btn">1</a>
        <a href="task2.html" class="number-btn">2</a>
        <a href="task3.html" class="number-btn">3</a>
        <a href="task4.html" class="number-btn">4</a>
        <a href="task5.html" class="number-btn">5</a>
        <a href="task6.html" class="number-btn">6</a>
        <a href="task7.html" class="number-btn">7</a>
    </div>

    <div class="action-buttons">
        <a href="../index.html" class="main-btn btn-home">Home</a>
    </div>

</body>
</html>
