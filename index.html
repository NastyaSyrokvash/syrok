<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasiya Syrakvash - Portfolio</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ --- */
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e6f0fa 0%, #d4e4f7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* --- ДЕКОРАТИВНЫЕ КРУГИ --- */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.5;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }
        .c1 { width: 250px; height: 250px; top: 5%; left: 5%; animation-delay: 0s; }
        .c2 { width: 350px; height: 350px; bottom: -5%; right: 5%; animation-delay: 2s; }
        .c3 { width: 120px; height: 120px; top: 20%; right: 15%; background-color: #d9e8ff; animation-delay: 1s; }
        .c4 { width: 80px; height: 80px; bottom: 25%; left: 10%; background-color: #b3d4ff; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* --- КАРТОЧКА --- */
        .card {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(150, 180, 255, 0.5);
            padding: 40px;
            display: flex;
            align-items: center; /* Теперь фото будет строго по центру */
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ФОТО --- */
        .photo-container {
            flex-shrink: 0;
        }

        .profile-img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 25px;
            border: 5px solid #cce0ff;
            box-shadow: 0 10px 25px rgba(150, 180, 255, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .profile-img:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.6);
        }

        /* --- ТЕКСТ --- */
        .content {
            text-align: left;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 24px;
            color: #4a7ab5;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 36px;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* --- БЛОК "ОБО МНЕ" --- */
        .about {
            background-color: #f5f9ff; /* Очень светлый голубой фон */
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 16px;
            color: #1a365d;
            line-height: 1.6;
            border-left: 5px solid #4a7ab5; /* Акцентная полоска слева */
        }

        .about p {
            margin: 5px 0;
        }

        .about strong {
            color: #2b4c7e;
        }

        .about-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
            font-size: 18px;
        }

        .about-icons span {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #4a7ab5;
        }

        /* --- КНОПКИ С ЦИФРАМИ --- */
        .numbers {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .number-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #cce0ff;
            color: #1a365d;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(150, 180, 255, 0.3);
        }

        .number-btn:hover {
            background-color: #1a365d;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(26, 54, 93, 0.3);
        }

        /* --- КНОПКА HANDOUTS --- */
        .main-btn {
            display: block;
            width: 100%;
            padding: 18px 0;
            background: linear-gradient(135deg, #1a365d 0%, #2b4c7e 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(26, 54, 93, 0.3);
            letter-spacing: 1px;
        }

        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(26, 54, 93, 0.5);
        }

        /* --- FOOTER --- */
                       .footer {
            position: absolute;
            bottom: 0; /* Прижимаем к самому низу */
            left: 0; /* Растягиваем на всю ширину */
            width: 100%;
            background-color: #e6f0fa; /* Делаем цвет фона таким же, как у страницы, чтобы перекрыть плашку */
            color: #7a9cc6;
            font-size: 14px;
            text-align: center;
            padding: 20px 0; /* Добавляем отступы, чтобы текст не прилипал к краям */
            z-index: 10; /* Поднимаем футер выше плашки */
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
                gap: 20px;
                align-items: center;
            }
            .content {
                text-align: center;
                align-items: center;
            }
            .about {
                text-align: left;
                border-left: none;
                border-top: 5px solid #4a7ab5; /* Полоска сверху на мобильных */
                padding: 15px;
            }
            .about-icons {
                justify-content: center;
            }
            .numbers {
                justify-content: center;
            }
            .profile-img {
                width: 200px;
                height: 200px;
            }
            h2 {
                font-size: 28px;
            }
            .main-btn {
                font-size: 18px;
                padding: 15px 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>

    <div class="card">
        <!-- Фото -->
        <div class="photo-container">
            <img src="photo.jpg" alt="Фото Анастасии" class="profile-img">
        </div>

        <!-- Контент -->
        <div class="content">
            <h1>Welcome!</h1>
            <h2>Created by Anastasiya Syrakvash</h2>
            
            <!-- Блок "Обо мне" -->
            <div class="about">
                <p><strong>About me:</strong> </p>
                <div class="about-icons">
                    <span>🎓 Student (Group 1451)</span>
                    <span>🐞 QA Tester</span>
                    <span>✈️ Traveler</span>
                    <span>🗣️ Language Learner</span>
                </div>
            </div>

            <!-- Кнопки с заданиями -->
            <div class="numbers">
                <a href="task0.html" class="number-btn">0</a>
                <a href="task1.html" class="number-btn">1</a>
                <a href="task2.html" class="number-btn">2</a>
                <a href="task3.html" class="number-btn">3</a>
                <a href="task4.html" class="number-btn">4</a>
                <a href="task5.html" class="number-btn">5</a>
                <a href="task6.html" class="number-btn">6</a>
                <a href="task7.html" class="number-btn">7</a>
            </div>

            <!-- Кнопка Handouts -->
            <a href="handouts.html" class="main-btn">Handouts</a>
        </div>
    </div>

    <div class="footer">&copy; 2026 Anastasiya Syrakvash. All rights reserved.</div>

</body>
</html>
