<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary algorithm - Task 4</title>
    
    <style>
        /* --- СИНИЙ ДИЗАЙН --- */
        body {
            background-color: #e6f0fa; /* Нежно-голубой фон */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные фоновые круги */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.5;
            z-index: -1;
        }
        .bg-c1 { width: 250px; height: 250px; top: 10%; left: 10%; }
        .bg-c2 { width: 300px; height: 300px; bottom: -5%; right: 5%; }
        .bg-c3 { width: 120px; height: 120px; top: 20%; right: 20%; }

        h1 {
            color: #1a365d;
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Блок с формулой (стилизованный под картинку) */
        .formula {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            color: #1a365d;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .calc-card {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.4);
            padding: 40px 50px;
            text-align: center;
            margin-bottom: 30px;
            width: 450px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
        }

        /* Поле ввода */
        input[type="number"] {
            width: 100px;
            padding: 10px;
            border: 2px solid #cce0ff;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            color: #1a365d;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4a7ab5; }
        
        /* Убираем стрелочки */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Кнопка Calculate */
        .calc-btn {
            background-color: #cce0ff;
            color: #1a365d;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background-color 0.3s;
        }
        .calc-btn:hover { background-color: #a3c4ff; }

        /* Блок для вывода результата */
        .result {
            margin-top: 20px;
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
            display: none; /* Скрыто до нажатия */
        }

        /* Кнопки навигации */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .number-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #cce0ff;
            color: #1a365d;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: background-color 0.3s;
        }
        .number-btn:hover { background-color: #a3c4ff; }

        .action-buttons { display: flex; gap: 20px; }
        .main-btn {
            display: block;
            padding: 15px 50px;
            background-color: #1a365d;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: background-color 0.3s;
        }
        .btn-home { background-color: #7a9cc6; }
        .main-btn:hover { background-color: #2b4c7e; }
    </style>
</head>
<body>

    <!-- Декоративные фоновые круги -->
    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>
    <div class="bg-circle bg-c3"></div>

    <h1>Binary algorithm</h1>

    <!-- Стилизованная формула H = K * lb(N) -->
    <div class="formula">H = K * lb(N)</div>

    <div class="calc-card">
        <div class="input-group">
            <span>lb(</span>
            <input type="number" id="numInput" placeholder="32" value="32">
            <span>) =</span>
        </div>
        
        <button class="calc-btn" onclick="calculateLog()">Calculate</button>

        <div class="result" id="result"></div>
    </div>

    <!-- Кнопки навигации -->
    <div class="buttons-container">
       <a href="index.html" class="number-btn">0</a>
        <a href="task1.html" class="number-btn">1</a>
        <a href="task2.html" class="number-btn">2</a>
        <a href="task3.html" class="number-btn">3</a>
        <a href="task4.html" class="number-btn">4</a>
        <a href="task5.html" class="number-btn">5</a>
        <a href="task6.html" class="number-btn">6</a>
        <a href="task7.html" class="number-btn">7</a>
    </div>

    <div class="action-buttons">
        <a href="../index.html" class="main-btn btn-home">Home</a>
        <a href="../handouts.html" class="main-btn">Handouts</a>
    </div>

    <script>
        function calculateLog() {
            let n = parseFloat(document.getElementById('numInput').value);
            let resultDiv = document.getElementById('result');

            // Проверка на корректный ввод
            if (isNaN(n) || n <= 0) {
                resultDiv.textContent = "Введите положительное число!";
                resultDiv.style.color = "#b02a2a"; // Красный цвет для ошибки
                resultDiv.style.display = 'block';
                return;
            }

            // Вычисляем двоичный логарифм (Log2)
            // Math.log2(n) возвращает степень, в которую нужно возвести 2
            let result = Math.log2(n);

            // Округляем до 4 знаков после запятой, если число не целое
            let roundedResult = Number.isInteger(result) ? result : result.toFixed(4);

            // Выводим результат
            resultDiv.innerHTML = `lb(${n}) = <span style="color:#2b4c7e; font-size: 28px;">${roundedResult}</span>`;
            resultDiv.style.color = "#1a365d";
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
